name: Continuous integration

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - '.golangci.yml'
      - '**.go'
      - 'go.{mod,sum}'
      - 'Makefile'
      - 'Taskfile'

  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - '.golangci.yml'
      - '**.go'
      - 'go.{mod,sum}'
      - 'Makefile'
      - 'Taskfile'
    tags: [ 'v*' ]

  schedule:
    - cron: 0 7 1 * * # at 07:00 on day-of-month 1, UTC

  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4.1.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v5.0.0
        with:
          go-version: 1.21.x
          check-latest: true

      - name: Run linter
        uses: golangci/golangci-lint-action@v3.7.0

  test:
    name: Testing
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.x
          - 1.21.x

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4.1.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v5.0.0
        with:
          go-version: '${{ matrix.go }}'
          check-latest: true
      - name: Set up environment
        run: make env deps

      - name: Run fast check source code
        run: make go-check
      - name: Run tests
        run: make test
        if: matrix.go != '1.21.x'
      - name: Run tests with coverage report
        run: make test-with-coverage
        if: matrix.go == '1.21.x'
      - name: Store code coverage report
        uses: actions/upload-artifact@v4.0.0
        with: { name: code-coverage-report, path: c.out }
        if: matrix.go == '1.21.x'

      - name: Check installation
        run: |
          make client install
          make server install
          [ $(ls bin/linux/*/* | wc -l) = 2 ]

  publish:
    name: Documentation
    needs: [ test ]
    uses: ./.github/workflows/cd.docs.yml
    permissions:
      id-token: write
      pages: write
    if: true

  release:
    name: Distribution
    needs: [ test ]
    uses: ./.github/workflows/cd.dist.yml
    permissions:
      contents: write
      packages: write
    secrets:
      OCTOLAB_RELEASER_CLIENT_ID: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
      OCTOLAB_RELEASER_KEY: ${{ secrets.OCTOLAB_RELEASER_KEY }}
    if: startsWith(github.ref, 'refs/tags/v')

  # a job of its own: if publishing fails after the release is out, rerun
  # only this job; the catalog keeps stable releases only
  vanity:
    name: Publishing the module
    needs: [ release ]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # without the Releaser credentials (a project generated from a template,
      # a private repository on the Free plan) warn and end successfully
      - name: Check the Releaser credentials
        id: preflight
        env:
          OCTOLAB_RELEASER_CLIENT_ID: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          OCTOLAB_RELEASER_KEY: ${{ secrets.OCTOLAB_RELEASER_KEY }}
        run: |
          if [ -n "${OCTOLAB_RELEASER_CLIENT_ID}" ] && [ -n "${OCTOLAB_RELEASER_KEY}" ]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::warning title=Vanity::OCTOLAB_RELEASER_CLIENT_ID and OCTOLAB_RELEASER_KEY are not available to this repository; set them as organization or repository secrets to publish the module to go.octolab.org. Nothing was published.'
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
          fi
      - name: Checkout the repository
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - name: Set up Go environment
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-go@v7.0.0
        with: { go-version: 1.27.4, cache: false }
      - name: Mint the catalog token
        if: steps.preflight.outputs.ready == 'true'
        id: catalog
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.OCTOLAB_RELEASER_KEY }}
          owner: octolab
          repositories: vanity
          permission-contents: write
      - name: Publish the module to go.octolab.org
        if: steps.preflight.outputs.ready == 'true'
        uses: octomation/vanity-action@v0.1.0
        with:
          token: ${{ steps.catalog.outputs.token }}
          packages: all

  report:
    name: Reporting
    needs: [ test ]
    runs-on: ubuntu-latest

    steps:
      - name: Fetch code coverage report
        uses: actions/download-artifact@v4.1.0
        with: { name: code-coverage-report }
      - name: Send code coverage report to Codecov
        uses: codecov/codecov-action@v3.1.4
        with: { files: c.out }

  notify:
    name: Notifying
    needs: [ lint, report, vanity ]
    runs-on: ubuntu-latest
    # success() is false when the vanity job is skipped, on every run but a
    # stable release
    if: github.event_name != 'pull_request'
      && !cancelled()

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4.1.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: ⚙️
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
