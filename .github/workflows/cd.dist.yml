name: Release delivery

on:
  workflow_call:
    secrets:
      OCTOLAB_RELEASER_CLIENT_ID:
        required: true
      OCTOLAB_RELEASER_KEY:
        required: true

  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

concurrency:
  group: dist
  cancel-in-progress: true

jobs:
  release:
    name: Releasing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      DOCKER_CLI_EXPERIMENTAL: enabled

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v5.0.0
        with:
          go-version: 1.21.x
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Login to GitHub Packages
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # the release uses github.token; the Formula goes to octolab/homebrew-tap
      # with a token of the OctoLab Releaser App scoped to the tap (as indexit);
      # minted whenever the release step runs, so a real release always has it
      - name: Mint the tap token
        id: tap
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.OCTOLAB_RELEASER_KEY }}
          owner: octolab
          repositories: homebrew-tap
          permission-contents: write
      - name: Publish the release
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          # a tag releases; a dispatch builds a snapshot and publishes nothing
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean --fail-fast' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}

  notify:
    name: Notifying
    needs: [ release ]
    runs-on: ubuntu-latest
    if: failure() || success()

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: 🚀
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
